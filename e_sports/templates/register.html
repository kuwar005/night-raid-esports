<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Raid — Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #07090e;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.12) 0%, transparent 60%);
        }
        .card {
            background: rgba(18, 24, 38, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px; width: 100%; max-width: 400px;
            backdrop-filter: blur(16px);
        }
        .brand-logo { font-size: 1.8rem; font-weight: 800; text-align: center; margin-bottom: 24px; background: linear-gradient(135deg, #ffffff 30%, #00e676 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; }
        input { width: 100%; padding: 14px; background: rgba(7, 9, 14, 0.7); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; color: #ffffff; font-size: 0.95rem; outline: none; }
        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #00e676 0%, #00c853 100%); color: #07090e; font-size: 1rem; font-weight: 800; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #94a3b8; }
        .footer-link a { color: #00e676; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-logo">Night Raid</div>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a password" required>
            </div>

            <button type="submit" class="submit-btn">Create Account ✨</button>
        </form>

        <div class="footer-link">
            Already have an account? <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>

</body>
</html>
