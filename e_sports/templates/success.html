<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; min-height: 100vh; display: flex; align-items: center; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 12px; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 text-center shadow-lg">
                <div class="display-3 text-success mb-2">✓</div>
                <h2 class="text-warning fw-bold mb-3">Team Registered Successfully!</h2>
                
                <div class="card bg-dark border-secondary p-3 text-start mb-4">
                    <p class="mb-2"><strong>Team Name:</strong> {{ team_name }}</p>
                    <p class="mb-2"><strong>Leader Name:</strong> {{ leader_name }}</p>
                    <p class="mb-2"><strong>Email:</strong> {{ email }}</p>
                    <p class="mb-2"><strong>Game:</strong> {{ game }}</p>
                    <p class="mb-0"><strong>Registered On:</strong> {{ reg_date }}</p>
                </div>

                <a href="{{ url_for('matches') }}" class="btn btn-warning fw-bold w-100 mb-2">View & Join Match Slots</a>
                <a href="{{ url_for('index') }}" class="btn btn-outline-light w-100">Register Another Team</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
