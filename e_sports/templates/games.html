<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Raid — Game Arenas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #07090e;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.12) 0%, transparent 60%);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, #00e676 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        nav a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .mana-badge {
            background: rgba(0, 230, 118, 0.15);
            border: 1px solid rgba(0, 230, 118, 0.4);
            color: #00e676;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        main {
            flex: 1;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            text-align: center;
        }

        .title-heading {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .welcome-sub {
            color: #00e676;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .game-card {
            background: rgba(18, 24, 38, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(12px);
            transition: all 0.25s ease;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 230, 118, 0.5);
            box-shadow: 0 10px 25px rgba(0, 230, 118, 0.2);
        }

        .game-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .game-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
        }

        .admin-box {
            margin-top: 50px;
        }

        .admin-btn {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(0, 230, 118, 0.12);
            color: #00e676;
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .admin-btn:hover {
            background: rgba(0, 230, 118, 0.25);
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-size: 0.88rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>

    <header>
        <a href="{{ url_for('index') }}" class="brand-logo">Night Raid</a>
        <nav>
            <a href="{{ url_for('matches') }}">Matches</a>
            <a href="{{ url_for('buy_mana') }}">Buy MP</a>
            <a href="{{ url_for('withdraw') }}">Cashout</a>
            <div class="mana-badge">💎 {{ balance }} MP</div>
        </nav>
    </header>

    <main>
        <h1 class="title-heading">Select Your Battleground</h1>
        <p class="welcome-sub">Welcome, {{ user }}!</p>

        <div class="games-grid">
            <a href="{{ url_for('freefire') }}" class="game-card">
                <div class="game-icon">🔥</div>
                <div class="game-title">Free Fire</div>
            </a>

            <a href="{{ url_for('bgmi') }}" class="game-card">
                <div class="game-icon">🎯</div>
                <div class="game-title">BGMI</div>
            </a>

            <a href="{{ url_for('coc') }}" class="game-card">
                <div class="game-icon">🏰</div>
                <div class="game-title">Clash of Clans</div>
            </a>
        </div>

        <div class="admin-box">
            <a href="{{ url_for('admin') }}" class="admin-btn">⚙️ Open Admin Panel</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Night Raid Esports. All rights reserved.</p>
    </footer>

</body>
</html>
