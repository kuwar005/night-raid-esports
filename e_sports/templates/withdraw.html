<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal — Night Raid Esports</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #06080C; color: #fff; font-family: 'Space Grotesk', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #0D111A; padding: 35px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); text-align: center; }
        h2 { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; color: #00F0FF; margin-bottom: 20px; text-transform: uppercase; }
        
        .flash-msg { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; font-weight: bold; }
        .flash-success { background: rgba(0, 240, 255, 0.15); border: 1px solid #00F0FF; color: #00F0FF; }
        .flash-error { background: rgba(255, 46, 99, 0.15); border: 1px solid #FF2E63; color: #FF2E63; }

        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; background: #06080C; color: #fff; outline: none; }
        input:focus { border-color: #00F0FF; }
        button { width: 100%; background: #FF2E63; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-family: 'Orbitron', sans-serif; cursor: pointer; transition: 0.3s; margin-bottom: 15px; }
        button:hover { background: #e01e4f; }
        a { color: #888; text-decoration: none; font-size: 0.85rem; }
        a:hover { color: #FFF; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Request Payout</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-msg flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="upi_id" placeholder="Enter UPI ID (e.g. name@upi)" required>
            <input type="number" name="amount" placeholder="Amount (₹)" min="1" required>
            <button type="submit">SUBMIT REQUEST</button>
        </form>
        <a href="/">← Return to Tournaments</a>
    </div>
</body>
</html>
