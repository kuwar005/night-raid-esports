<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - {{ match.match_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; min-height: 100vh; display: flex; align-items: center; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 12px; }
        .qr-box { background: #ffffff; padding: 15px; border-radius: 10px; display: inline-block; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 text-center shadow-lg">
                <h3 class="text-warning fw-bold mb-1">{{ match.match_title }}</h3>
                <p class="text-secondary small mb-3">{{ match.game }} ({{ match.match_type }})</p>

                <div class="alert alert-dark border-secondary">
                    <span class="fs-4 text-success fw-bold">Amount to Pay: ₹{{ match.price }}</span>
                </div>

                <!-- Generated Payment QR Code -->
                <div class="my-3">
                    <div class="qr-box shadow">
                        <img src="{{ qr_code_url }}" alt="Scan to Pay QR Code" class="img-fluid">
                    </div>
                    <p class="text-muted small mt-2">Scan using Google Pay, PhonePe, Paytm, or any UPI App</p>
                    <p class="text-info small"><strong>UPI ID:</strong> {{ upi_id }}</p>
                </div>

                <hr class="border-secondary">

                <!-- Confirm Payment Form -->
                <form action="{{ url_for('confirm_payment', match_id=match.match_id) }}" method="POST" class="text-start">
                    <div class="mb-3">
                        <label class="form-label">Your Team Name</label>
                        <input type="text" name="team_name" class="form-control bg-dark text-white border-secondary" placeholder="Enter registered team name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">UPI Reference / Transaction ID</label>
                        <input type="text" name="transaction_id" class="form-control bg-dark text-white border-secondary" placeholder="e.g. 123456789012" required>
                    </div>
                    <button type="submit" class="btn btn-success fw-bold w-100">Submit Payment Verification</button>
                </form>
                
                <a href="{{ url_for('matches') }}" class="btn btn-link text-secondary text-decoration-none mt-2">Cancel</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
